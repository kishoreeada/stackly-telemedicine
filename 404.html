<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#062d37">
  <title>Stackly — Page not found</title>
  <meta name="description" content="The Stackly page you requested could not be found.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="404.css">
</head>
<body>
  <main class="not-found" aria-labelledby="nf-title">
    <section class="not-found-shell">
      <div class="nf-topline">
        <a class="nf-brand" href="index.html" aria-label="Stackly home">
          <span class="nf-mark">↯</span>
          <span>STACKLY</span>
        </a>
        <span class="nf-kicker"><i></i> PAGE NOT FOUND</span>
      </div>

      <div class="nf-content">
        <p class="nf-code" aria-hidden="true">404</p>
        <div class="nf-copy-wrap">
          <h1 id="nf-title" class="nf-title">This care path<br><em>doesn't exist.</em></h1>
          <p class="nf-copy">The page may have moved or the link may not be available yet. Choose where you want to continue.</p>
        </div>
      </div>

      <div class="nf-actions">
        <a class="nf-btn primary" href="index.html">Back to home <span>↗</span></a>
        <button class="nf-btn" id="back-previous" type="button">Back to previous page <span>←</span></button>
      </div>

      <div class="nf-footer-line">
        <span>Connected care, thoughtfully designed.</span>
        <span>Stackly · 2026</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const button = document.getElementById('back-previous');
      button?.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.assign('index.html');
        }
      });
    })();
  </script>
</body>
</html>
